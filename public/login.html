<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OpenVPN Manager</title>
    <script>
        (function () {
            var theme = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root {
            --page-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: #ffffff;
            --text-primary: #2c3e50;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-text: #333333;
        }

        [data-theme="dark"] {
            --page-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --container-bg: #232338;
            --text-primary: #e6e6f0;
            --input-bg: #2d2d46;
            --input-border: #3d3d5c;
            --input-text: #e6e6f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            background: var(--container-bg);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-icon {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .lang-select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .lang-select option {
            color: #333;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .login-content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1em;
            background: var(--input-bg);
            color: var(--input-text);
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="header-controls">
                <select id="lang-select" class="lang-select">
                    <option value="it">🇮🇹 IT</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button id="theme-toggle" class="btn-icon" title="Cambia tema">🌙</button>
            </div>
            <h1 data-i18n="appTitle">🔐 OpenVPN Manager</h1>
            <p data-i18n="loginSubtitle">Accedi per continuare</p>
        </div>

        <div class="login-content">
            <div id="message" class="message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="loginUsername">Username</label>
                    <input type="text" id="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="loginPassword">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn" data-i18n="loginBtn">Accedi</button>
            </form>
        </div>

        <div class="footer">
            <p>© Copyright 2024-2026 Tuxxle - All rights reserved.</p>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script>
        document.getElementById('lang-select').value = currentLang;
        applyLanguage(currentLang);
        document.getElementById('theme-toggle').textContent =
            document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';

        document.getElementById('lang-select').addEventListener('change', (e) => {
            applyLanguage(e.target.value);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/';
                } else {
                    messageDiv.textContent = data.error || t('loginInvalid');
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = t('loginCommError');
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
